<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step Up cards preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light dark;--bg:#efe9e1;--ink:#33272a;--panel:#fbf8f4;--line:#d9cfc3}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1719;--ink:#efe6e0;--panel:#2a2124;--line:#443a3d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif}
  header{padding:22px 20px 6px;max-width:1280px;margin:0 auto}
  h1{margin:0;font-size:30px;font-weight:600}
  p.sub{margin:6px 0 0;font-size:18px;opacity:.8}
  .tools{max-width:1280px;margin:14px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .tools label{display:flex;flex-direction:column;font-size:14px;gap:3px;font-family:system-ui,sans-serif}
  .tools input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
  .grid{max-width:1280px;margin:22px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
  figure{margin:0}
  .frame{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#fff}
  .frame .host{position:absolute;left:0;top:0;width:600px;height:900px;transform-origin:0 0}
  figcaption{margin-top:10px;font-size:19px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Step Up cards</h1>
  <p class="sub">Five card designs. Type below to see your own text on every card.</p>
</header>
<div class="tools" id="tools"></div>
<main class="grid" id="grid"></main>
<script src="stepup-cards.js"></script>
<script>
(function(){
  var fields=[['bride','Bride name'],['groom','Groom name'],['day','Day'],['date','Date'],['month','Month'],['year','Year'],['time','Time'],['venue','Venue'],['address','Address'],['closing','Closing line'],['from','From (optional)']];
  var data={};
  var tools=document.getElementById('tools'),grid=document.getElementById('grid');
  fields.forEach(function(f){
    var l=document.createElement('label');l.textContent=f[1];
    var i=document.createElement('input');i.placeholder=StepUpCards.defaults[f[0]]||'';
    i.addEventListener('input',function(){data[f[0]]=i.value||undefined;draw();});
    l.appendChild(i);tools.appendChild(l);
  });
  var hosts=[];
  StepUpCards.themes.forEach(function(t){
    var fig=document.createElement('figure');
    var fr=document.createElement('div');fr.className='frame';
    var host=document.createElement('div');host.className='host';
    fr.appendChild(host);
    var cap=document.createElement('figcaption');cap.textContent=t.name;
    fig.appendChild(fr);fig.appendChild(cap);grid.appendChild(fig);
    hosts.push({id:t.id,host:host,frame:fr});
  });
  function draw(){
    hosts.forEach(function(h){
      StepUpCards.mount(h.host,h.id,data);
      var s=h.frame.clientWidth/600;h.host.style.transform='scale('+s+')';
    });
  }
  window.addEventListener('resize',draw);
  draw();
})();
</script>
</body>
</html>
