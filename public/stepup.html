<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step Up - Live Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --champagne:#d9c9b4; --pearl:#f3ece3; --mauve:#b98a96; --umber:#4a3a33; --gold:#c9a45c;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#cbbba7;color:var(--umber);font-family:"Cormorant Garamond",Georgia,serif}
  body{overflow-x:hidden}
  #spacer{width:1px}
  canvas{position:fixed;left:0;top:0;pointer-events:none}
  #scene{z-index:1}
  #fx{z-index:20}
  #dim{position:fixed;inset:0;z-index:3;background:rgba(36,24,24,.55);opacity:0;pointer-events:none}
  .rig{position:fixed;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none;will-change:transform}
  #rigBack{z-index:4}
  #rigFront{z-index:6}
  #card{position:fixed;left:0;top:0;z-index:5;transform-origin:0 0;will-change:transform;pointer-events:none}
  #cardScale{position:absolute;left:0;top:0;width:600px;height:900px;transform-origin:0 0}
  #card .shadowfx{position:absolute;inset:0;box-shadow:0 18px 60px rgba(40,20,20,.45)}

  /* box parts (units are px at scale 1, origin = centre of the front rim) */
  .bx-shadow{position:absolute;left:-64px;top:128px;width:128px;height:26px;border-radius:50%;background:rgba(40,22,26,.4);filter:blur(6px)}
  .bx-glow{position:absolute;left:-90px;top:-170px;width:180px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,176,.95),rgba(255,220,140,.35) 55%,rgba(255,220,140,0));opacity:0;mix-blend-mode:screen}
  .bx-inner{position:absolute;left:-50px;top:-34px;width:100px;height:34px;background:linear-gradient(#2b1d21,#6a4d54);box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
  .lid{position:absolute;left:-52px;top:-34px;width:104px;height:100px;transform-origin:50% 0;background:linear-gradient(#f6f0e8,#e6dbcf);border-radius:2px;box-shadow:0 1px 0 rgba(120,90,70,.35)}
  .lid::after{content:"";position:absolute;left:45px;top:0;width:14px;height:100%;background:linear-gradient(90deg,#cfae6c,#f4e5b4,#c9a45c)}
  .lid.in{background:linear-gradient(#cfaeb6,#b78d98)}
  .lid.in::after{background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.2),rgba(255,255,255,0))}
  #lidBack{z-index:2}
  .front{position:absolute;left:-50px;top:0;width:100px;height:140px;background:linear-gradient(180deg,#f6f0e8 0%,#e8ddd0 55%,#d7c9ba 100%);box-shadow:inset 0 -14px 20px rgba(80,60,50,.18),inset 0 0 0 1px rgba(255,255,255,.4)}
  .front .rib{position:absolute;left:43px;top:0;width:14px;height:100%;background:linear-gradient(90deg,#cfae6c,#f4e5b4,#c9a45c);box-shadow:0 0 3px rgba(80,60,30,.3)}
  .front .mono{position:absolute;left:0;right:0;top:80px;text-align:center;font-family:"Great Vibes","Brush Script MT",cursive;font-size:26px;line-height:1;color:#b58a35;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .lip{position:absolute;left:-52px;top:0;width:104px;height:18px;background:linear-gradient(#fbf7f1,#e6dbcf);box-shadow:0 3px 4px rgba(70,50,40,.25);z-index:5}
  .lip::after{content:"";position:absolute;left:45px;top:0;width:14px;height:100%;background:linear-gradient(90deg,#cfae6c,#f4e5b4,#c9a45c)}
  .bow{position:absolute;left:-34px;top:-34px;width:68px;height:34px;z-index:6}
  #lidFront{z-index:7}

  /* doors */
  #gate{position:fixed;inset:0;z-index:50;perspective:1700px;overflow:hidden;cursor:pointer;outline:none}
  #gate.gone{display:none}
  #bloom{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,244,214,1) 0%,rgba(255,232,180,.92) 30%,rgba(235,205,150,.7) 70%,rgba(200,170,120,.6) 100%);opacity:1;transition:opacity 2.2s ease .5s}
  #gate.open #bloom{opacity:0}
  .leaf{position:absolute;top:0;width:50.3%;height:100%;transition:transform 2.9s cubic-bezier(.55,.05,.18,1),filter 2.9s ease;will-change:transform;
    background:linear-gradient(90deg,#c9b394,#e7d9c4 14%,#f1e6d5 50%,#e3d2bb 100%);box-shadow:inset 0 0 70px rgba(90,60,40,.28)}
  #leafL{left:0;transform-origin:0 50%}
  #leafR{right:0;transform-origin:100% 50%;background:linear-gradient(270deg,#c9b394,#e7d9c4 14%,#f1e6d5 50%,#e3d2bb 100%)}
  #gate.open #leafL{transform:rotateY(-104deg);filter:brightness(.75)}
  #gate.open #leafR{transform:rotateY(104deg);filter:brightness(.75)}
  .leaf .crown{position:absolute;left:0;right:0;top:0;height:5%;background:linear-gradient(#b8934a,#e6c677 40%,#9a7430);opacity:.9;box-shadow:0 3px 8px rgba(60,40,20,.35)}
  .leaf .panel{position:absolute;left:11%;right:11%;border:2px solid #b8934a;border-radius:3px;
    background:linear-gradient(#f5ecdf,#e7d7c1);
    box-shadow:inset 0 0 0 7px rgba(184,147,74,.18),inset 0 0 38px rgba(110,80,50,.2),0 0 0 1px rgba(255,255,255,.5)}
  .leaf .panel::before{content:"";position:absolute;inset:14px;border:1px solid rgba(184,147,74,.7);border-radius:2px}
  .panel.p1{top:8%;height:40%} .panel.p2{top:51%;height:17%} .panel.p3{top:71%;height:22%}
  .leaf .handle{position:absolute;top:46%;width:11px;height:15%;border-radius:7px;background:linear-gradient(90deg,#8a6420,#f3dc92 45%,#9a7330);box-shadow:0 2px 6px rgba(50,30,10,.4)}
  #leafL .handle{right:4.5%} #leafR .handle{left:4.5%}
  #plaque{position:absolute;left:50%;top:48%;width:min(46vw,190px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fbf3de,#ead8ae 60%,#cdae6e);
    border:3px solid #b8934a;box-shadow:0 0 0 6px rgba(184,147,74,.28),0 10px 28px rgba(60,40,20,.4),inset 0 0 22px rgba(120,90,40,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s ease,transform .8s ease}
  #plaque .ini{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(42px,12vw,64px);line-height:1;color:#8a6420;text-shadow:0 1px 0 rgba(255,255,255,.7)}
  #plaque .nm{margin-top:6px;font-size:clamp(11px,2.9vw,14px);letter-spacing:.18em;text-transform:uppercase;color:#6b5230;padding:0 16px;white-space:normal;line-height:1.3;max-width:100%}
  #gate.open #plaque{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
  #tapHint{position:absolute;left:0;right:0;top:calc(48% + min(23vw,95px) + 28px);text-align:center;font-size:clamp(18px,4.8vw,23px);font-style:italic;color:#5a4630;letter-spacing:.06em;transition:opacity .4s}
  #tapHint::before{content:"";display:block;width:46px;height:46px;margin:0 auto 10px;border-radius:50%;border:2px solid rgba(138,100,32,.65);animation:ring 2s ease-out infinite}
  #gate.open #tapHint{opacity:0}
  @keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}

  /* ui */
  .ui{position:fixed;z-index:30;opacity:0;pointer-events:none;transition:opacity .6s ease}
  .ui.on{opacity:1;pointer-events:auto}
  .btn{font:600 16px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;color:#4a3a33;background:rgba(251,246,238,.92);border:1px solid rgba(185,147,80,.8);border-radius:999px;padding:11px 18px;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px rgba(60,40,30,.22);backdrop-filter:blur(4px);min-height:42px;display:inline-flex;align-items:center;gap:8px}
  .btn:focus-visible,#gate:focus-visible{outline:3px solid #8a6420;outline-offset:3px}
  #skip{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top))}
  #music{left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top))}
  #hint{left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;font-size:19px;font-style:italic;color:#fff;text-shadow:0 1px 8px rgba(40,25,20,.7)}
  #actions{left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 14px}
  @media (prefers-reduced-motion:reduce){.leaf,#bloom,#plaque{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="spacer"></div>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="dim" aria-hidden="true"></div>
<div id="rigBack" class="rig" aria-hidden="true">
  <div class="bx-shadow"></div>
  <div class="bx-inner"></div>
  <div class="bx-glow" id="bxGlow"></div>
  <div class="lid in" id="lidBack" style="display:none"></div>
</div>
<div id="card" aria-label="Wedding invitation"><div id="cardScale"></div></div>
<div id="rigFront" class="rig" aria-hidden="true">
  <div class="front"><div class="rib"></div><div class="mono" id="bxMono"></div></div>
  <div class="lip" id="bxLip"></div>
  <div class="lid" id="lidFront"></div>
  <svg class="bow" id="bxBow" viewBox="0 0 68 34"><defs><linearGradient id="bowg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e8bd"/><stop offset=".5" stop-color="#d4b270"/><stop offset="1" stop-color="#b58a35"/></linearGradient></defs>
    <path d="M34 20C22 4 4 4 3 14c-1 9 16 10 31 6z" fill="url(#bowg)"/><path d="M34 20C46 4 64 4 65 14c1 9-16 10-31 6z" fill="url(#bowg)"/>
    <path d="M30 22L18 34M38 22l12 12" stroke="#cfae6c" stroke-width="5" stroke-linecap="round"/><ellipse cx="34" cy="19" rx="6" ry="5" fill="#b58a35"/></svg>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="gate" role="button" tabindex="0" aria-label="Open the invitation">
  <div id="bloom"></div>
  <div class="leaf" id="leafL"><div class="crown"></div><div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div><div class="handle"></div></div>
  <div class="leaf" id="leafR"><div class="crown"></div><div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div><div class="handle"></div></div>
  <div id="plaque"><div class="ini" id="plIni"></div><div class="nm" id="plNames"></div></div>
  <div id="tapHint">Tap to enter</div>
</div>

<button class="btn ui" id="skip" type="button">Skip</button>
<button class="btn ui" id="music" type="button" style="display:none">Music on</button>
<div class="ui" id="hint">Scroll to walk up</div>
<div class="ui" id="actions"></div>
<audio id="aud" loop preload="none"></audio>

<script src="stepup-cards.js"></script>
<script>
(function(){
'use strict';

/* ================= data ================= */
var data = {};
try{
  if(window.STEPUP_DATA) data = window.STEPUP_DATA;
  else {
    var q = new URLSearchParams(location.search).get('d');
    if(q) data = JSON.parse(decodeURIComponent(escape(atob(q))));
  }
}catch(e){ data = {}; }
var theme = data.theme || new URLSearchParams(location.search).get('theme') || 'pearl';
var D0 = StepUpCards.defaults;
function val(k){ return (data[k] !== undefined && data[k] !== null && data[k] !== '') ? data[k] : D0[k]; }
var ini = [(String(val('bride')).trim().charAt(0)||'B').toUpperCase(), (String(val('groom')).trim().charAt(0)||'G').toUpperCase()];

var $ = function(id){ return document.getElementById(id); };
$('plIni').textContent = ini[0] + ' & ' + ini[1];
$('plNames').textContent = val('bride') + ' \u00B7 ' + val('groom');
$('bxMono').textContent = ini[0] + ini[1];
document.title = val('bride') + ' & ' + val('groom') + ' - Wedding Invitation';

var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= math ================= */
function clamp(x,a,b){ return Math.min(b, Math.max(a,x)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function ss(a,b,x){ x = clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
function eio(t){ t = clamp(t,0,1); return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function eout(t){ t = clamp(t,0,1); return 1-Math.pow(1-t,3); }
function rng(seed){ var a = seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ================= world ================= */
var N=16, D=0.46, SH=0.17, HW=1.55, SIDE=2.3;
var LAND_Z=N*D, TOP_Y=N*SH;
var TABLE_Z=LAND_Z+2.6, TABLE_R=0.7, TABLE_H=0.78;
var BACK_Z=TABLE_Z+2.5;
var BOX_Y=TOP_Y+TABLE_H, BOX_W=0.3, BOX_H=0.42;
var EYE=1.5;

/* ================= canvas ================= */
var cv=$('scene'), ctx=cv.getContext('2d');
var fx=$('fx'), fctx=fx.getContext('2d');
var W=0,H=0,DPR=1,F=600, S_FIT=0.6;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  [cv,fx].forEach(function(c){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); c.style.width=W+'px'; c.style.height=H+'px'; });
  ctx.setTransform(DPR,0,0,DPR,0,0); fctx.setTransform(DPR,0,0,DPR,0,0);
  F=H*0.85;
  S_FIT=Math.min(W*0.94/600, H*0.84/900);
  $('spacer').style.height=(H*6.5)+'px';
  sizeCard();
}

/* ================= sprites ================= */
function mk(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function shade(hexc,a,t){
  var h=hexc.replace('#',''); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  var tr=t==='w'?255:0; return 'rgb('+Math.round(r+(tr-r)*a)+','+Math.round(g+(tr-g)*a)+','+Math.round(b+(tr-b)*a)+')';
}
function mkRose(col,seed){
  var c=mk(128,128), g=c.getContext('2d'), R=rng(seed), i, cx=64, cy=64;
  function petal(x,y,rx,ry,rot,sc){
    g.save(); g.translate(x,y); g.rotate(rot);
    var gr=g.createRadialGradient(-rx*.2,-ry*.3,1,0,0,Math.max(rx,ry));
    gr.addColorStop(0,shade(col,.38,'w')); gr.addColorStop(.6,col); gr.addColorStop(1,shade(col,.4,'k'));
    g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,rx,ry,0,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(60,25,35,.35)'; g.lineWidth=.9; g.stroke(); g.restore();
  }
  g.fillStyle=shade(col,.45,'k'); g.beginPath(); g.arc(cx,cy,58,0,7); g.fill();
  for(i=0;i<7;i++){ var a=i*Math.PI*2/7+R(); petal(cx+Math.cos(a)*28,cy+Math.sin(a)*28,30,34,a+Math.PI/2); }
  for(i=0;i<5;i++){ var b=i*Math.PI*2/5+R(); petal(cx+Math.cos(b)*15,cy+Math.sin(b)*15,20,23,b+Math.PI/2); }
  for(i=0;i<4;i++){ var d=i*Math.PI/2+R(); petal(cx+Math.cos(d)*7,cy+Math.sin(d)*7,12,14,d+Math.PI/2); }
  g.strokeStyle=shade(col,.5,'w'); g.globalAlpha=.55; g.lineWidth=1.2; g.beginPath(); g.arc(cx,cy,5,0.2,4.6); g.stroke(); g.globalAlpha=1;
  return c;
}
function mkHydrangea(cols,seed){
  var c=mk(160,160), g=c.getContext('2d'), R=rng(seed), i, j;
  for(i=0;i<70;i++){
    var a=R()*Math.PI*2, d=Math.sqrt(R())*66, x=80+Math.cos(a)*d, y=80+Math.sin(a)*d*0.92;
    var col=cols[Math.floor(R()*cols.length)], s=9+R()*7, rot=R()*6;
    g.save(); g.translate(x,y); g.rotate(rot);
    for(j=0;j<4;j++){ g.rotate(Math.PI/2); var gr=g.createRadialGradient(0,-s*.5,1,0,-s*.5,s); gr.addColorStop(0,shade(col,.35,'w')); gr.addColorStop(1,shade(col,.25,'k')); g.fillStyle=gr; g.beginPath(); g.ellipse(0,-s*.55,s*.55,s*.6,0,0,7); g.fill(); }
    g.fillStyle=shade(col,.55,'k'); g.beginPath(); g.arc(0,0,s*.14,0,7); g.fill(); g.restore();
  }
  return c;
}
var SPR={};
function buildSprites(){
  SPR.roses=[mkRose('#c79aa5',1), mkRose('#a8727f',2), mkRose('#e3c4c9',3), mkRose('#b98a96',4)];
  SPR.hyd=[mkHydrangea(['#c9a0aa','#b98a96','#d9b8c0','#a47683'],7), mkHydrangea(['#d9b8c0','#c9a0aa','#e8d0d5'],8)];
}
function marbleTex(){
  var c=mk(1024,512), g=c.getContext('2d'), R=rng(99), i, k;
  var gr=g.createLinearGradient(0,0,1024,512); gr.addColorStop(0,'#efe8e0'); gr.addColorStop(.5,'#e7ded6'); gr.addColorStop(1,'#efe6de');
  g.fillStyle=gr; g.fillRect(0,0,1024,512);
  for(i=0;i<46;i++){
    var x=R()*1024,y=R()*512,r=40+R()*130, b=g.createRadialGradient(x,y,0,x,y,r);
    var col=R()>.5?'150,125,125':'210,200,195'; b.addColorStop(0,'rgba('+col+','+(.06+R()*.1)+')'); b.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=b; g.fillRect(x-r,y-r,r*2,r*2);
  }
  function vein(x,y,ang,len,w,depth){
    var px=x,py=y,a=ang;
    for(var pass=0;pass<2;pass++){
      g.beginPath(); px=x; py=y; a=ang; g.moveTo(px,py);
      var rr=rng(Math.floor(x*7+y*13+len)+0);
      for(var s=0;s<len;s+=6){ a+=(rr()-.5)*.55; px+=Math.cos(a)*6; py+=Math.sin(a)*6; g.lineTo(px,py); if(pass===1&&depth<2&&rr()<.045){ vein(px,py,a+(rr()>.5?1:-1)*(.5+rr()*.7),len*.4,w*.6,depth+1); } }
      g.strokeStyle= pass===0 ? 'rgba(110,88,92,.16)' : 'rgba(86,64,70,.5)';
      g.lineWidth= pass===0 ? w*3.2 : w; g.lineCap='round'; g.stroke();
    }
  }
  for(i=0;i<16;i++){ vein(R()*1024,R()*512,R()*Math.PI*2,160+R()*260,.7+R()*1.5,0); }
  return c;
}
var MARBLE;

/* ================= camera ================= */
var cam={x:0,y:EYE,z:-3,hz:H*.4};
var T=0;
function stepY(z){ if(z<=0) return 0; if(z>=LAND_Z) return TOP_Y; var u=z/D, i=Math.floor(u), f=u-i; return (i+ss(.12,.8,f))*SH; }
function updateCam(p){
  var s=clamp(p/0.80,0,1), e=0.5-0.5*Math.cos(Math.PI*s);
  cam.z=lerp(-3.0, TABLE_Z-0.98, e);
  var onStairs = cam.z>0 && cam.z<LAND_Z;
  cam.y=stepY(cam.z)+EYE+(onStairs?Math.sin(cam.z/D*Math.PI*2)*.012:0);
  cam.x=Math.sin(T*.5)*.03*(1-s*.8);
  var dzb=Math.max(.3,TABLE_Z-cam.z), cy=BOX_Y+BOX_H*.5;
  var solved=H*(W<H?.58:.6)-(cam.y-cy)*F/dzb;
  cam.hz=lerp(H*.42, solved, ss(.35,1,s));
}
function P(x,y,z){ var dz=z-cam.z, sc=F/dz; return {x:W/2+(x-cam.x)*sc, y:cam.hz+(cam.y-y)*sc, s:sc, dz:dz}; }

/* ================= scene drawing ================= */
function drawBackdrop(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8f7f70'); g.addColorStop(.45,'#c9b9a4'); g.addColorStop(1,'#d8cab7');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawBackWall(){
  var z=BACK_Z, sc=F/(z-cam.z);
  var yT=cam.hz+(cam.y-10)*sc, yB=cam.hz+(cam.y-(TOP_Y-2.5))*sc;
  var cols=[['#a99884','#d3c4b0'],['#b4a38e','#dccfbb']];
  for(var x=-8,i=0;x<8;x+=.4,i++){
    var x0=W/2+(x-cam.x)*sc, x1=W/2+(x+.4-cam.x)*sc;
    if(x1<0||x0>W) continue;
    var c=cols[i%2], g=ctx.createLinearGradient(x0,0,x1,0);
    g.addColorStop(0,c[0]); g.addColorStop(.5,c[1]); g.addColorStop(1,c[0]);
    ctx.fillStyle=g; ctx.fillRect(x0,yT,x1-x0+1,yB-yT);
  }
  // warm glow behind the table

  if(data.music){ try{ aud.play(); elMusic.textContent='Music off'; }catch(e){} }
  if(reduced){
    window.scrollTo(0,maxScroll()); cur=1;
    setTimeout(function(){ gate.classList.add('gone'); document.documentElement.style.overflow=''; ui(elActions,true); },300);
    return;
  }
  setTimeout(function(){
    gate.classList.add('gone'); document.documentElement.style.overflow='';
    ui(elSkip,true); ui(elMusic,!!data.music);
    startAuto(0);
  },3300);
  setTimeout(function(){ ui(elHint,true); },2600);
}
gate.addEventListener('click',openDoors);
gate.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDoors(); } });

/* ================= main loop ================= */
var last=performance.now();
function frame(now){
  T=now/1000; last=now;
  var tp=targetP();
  cur+=(tp-cur)*(reduced?1:.12); if(Math.abs(tp-cur)<.0004) cur=tp;
  updateCam(cur);
  drawScene();
  var ee=updateBox(cur);
  drawFx();
  // hints
  ui(elHint, started && cur>.02 && cur<.74 && !finished);
  if(cur>.5 && elHint.textContent!=='Scroll to continue') {}
  var fin=ee>.985;
  if(fin!==finished){ finished=fin; ui(elActions,fin); ui(elSkip,!fin&&started); }
  requestAnimationFrame(frame);
}

/* debug hook for testing */
window.__stepup={ setP:function(p){ stopAuto(); window.scrollTo(0,p*maxScroll()); cur=p; }, open:openDoors };

window.addEventListener('resize',resize);
buildSprites(); MARBLE=marbleTex(); resize();
document.fonts && document.fonts.ready && document.fonts.ready.then(function(){ StepUpCards.fit(cardScale); });
requestAnimationFrame(frame);
})();
</script>
