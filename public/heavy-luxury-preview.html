<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavy Luxury · Mubiey Studio</title>
<style>
:root{color-scheme:dark;--wine:#3b0717;--gold:#c7a36a;--paper:#f0e4c9}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity}body{margin:0;background:#17070c;color:var(--paper);font-family:Georgia,'Times New Roman',serif}.stage{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;scroll-snap-align:start;padding:5vh 4vw}.stage img{display:block;width:auto;height:90svh;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 45px #000b)}.cover{min-height:100svh;background:radial-gradient(ellipse at center,#501325,#16060a 70%)}.cover img{height:min(92svh,900px);transform:translateY(0);transition:transform 1.4s cubic-bezier(.2,.75,.2,1),opacity 1s}.cover.open img{transform:translateY(-120vh) scale(.82);opacity:0}.open-btn{position:absolute;bottom:5vh;border:1px solid var(--gold);background:#280811eF;color:var(--paper);padding:13px 24px;font:12px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px #c7a36a24}.cover.open .open-btn{opacity:0;pointer-events:none}.hint{position:absolute;top:18px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:4px;color:#e4c58c;text-transform:uppercase}.stage:not(.cover){opacity:.25;transform:translateY(35px);transition:opacity 1s ease,transform 1s ease}.stage.visible{opacity:1;transform:none}.stage:after{content:'✦';position:absolute;bottom:18px;color:var(--gold);opacity:.7;font-size:17px;animation:twinkle 2.6s ease-in-out infinite}.scroll-label{position:absolute;bottom:4vh;font:10px Arial,sans-serif;letter-spacing:3px;color:#ead7b3;animation:bob 1.8s infinite}@keyframes bob{50%{transform:translateY(7px)}}@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}@media(max-width:600px){.stage{padding:2vh 2vw}.stage img{height:auto;width:100%;max-height:88svh;object-fit:contain}.cover img{width:auto;height:86svh}.hint{font-size:9px;letter-spacing:2px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<section class="stage cover" id="cover"><p class="hint">MUBIEY STUDIO · HEAVY LUXURY</p><img src="assets/premium/heavy-luxury/01-cover.png" alt="Heavy Luxury invitation envelope cover"><button class="open-btn" id="open">Open invitation</button><span class="scroll-label">TAP TO REVEAL</span></section>
<section class="stage"><img src="assets/premium/heavy-luxury/02-card-reveal.png" alt="Invitation card revealed from the envelope" loading="lazy"></section>
<section class="stage"><img src="assets/premium/heavy-luxury/03-wedding-details.png" alt="Wedding details and directions design reference" loading="lazy"></section>
<section class="stage"><img src="assets/premium/heavy-luxury/04-blessing.png" alt="Final blessing page design reference" loading="lazy"></section>
<script>
const cover=document.querySelector('#cover');document.querySelector('#open').addEventListener('click',()=>{cover.classList.add('open');setTimeout(()=>document.querySelectorAll('.stage:not(.cover)').forEach((s,i)=>setTimeout(()=>s.classList.add('visible'),i*180)),250);setTimeout(()=>document.querySelectorAll('.stage:not(.cover)')[0].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}),650)});
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.18});document.querySelectorAll('.stage:not(.cover)').forEach(s=>observer.observe(s));
</script></body></html>
